# ============================================================
# POSTGRESQL
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/smart_recipe_db
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================
# MONGODB
# ============================================================

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smart_recipe_users}


# ============================================================
# BASEX
# ============================================================

basex.host=${BASEX_HOST:localhost}
basex.port=${BASEX_PORT:1984}
basex.username=${BASEX_USERNAME:admin}
basex.password=${BASEX_PASSWORD}
basex.database=${BASEX_DATABASE:smart_recipes}


# ============================================================
# APPLICATION
# ============================================================

spring.jackson.serialization.indent-output=true

server.error.include-message=always
server.error.include-stacktrace=never

# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000